# migrate.conf - ALL settings for migrate.sh (the script has no built-in defaults).
# Lives next to migrate.sh in the NFS share; MIGRATE_CONF=/path/file overrides the location.
# Every setting is required unless marked (optional). The script checks this on start
# and stops with a list of missing or invalid entries.

# ---- oVirt side (export / restore / release) ----------------------------------------
ENGINE_URL="https://ovirt-engine.example.com/ovirt-engine/api"
ENGINE_USER="admin@ovirt@internalsso"         # oVirt 4.5 with Keycloak; older/legacy setups: admin@internal
ENGINE_CA="/etc/pki/vdsm/certs/cacert.pem"   # engine CA on every oVirt host, or "insecure"
# Password (optional): leave both empty to be prompted. Never put the password itself
# into this file - it sits on the share. Use a local file on the oVirt host (chmod 600).
ENGINE_PASS=""
ENGINE_PASS_FILE="/root/.ovirt-api-pass"     # create with: printf '%s' 'PASSWORD' > FILE; chmod 600 FILE

DATAMOVER_VM="Datamover"         # helper VM, must run on the host where you run "export"
DM_INTERFACE="virtio_scsi"       # bus used when hot-attaching disks to the datamover
DEFAULT_INTERFACE="virtio_scsi"  # restore fallback if no saved state exists for a disk
SHUTDOWN_TIMEOUT=600             # seconds to wait for a clean guest shutdown
DEVICE_TIMEOUT=180               # seconds to wait for the LV to appear after attaching
SNAPSHOT_TIMEOUT=7200            # seconds to wait for one snapshot removal (merge) to finish
PAR=4                            # parallel qemu-img exports
EXPORT_MAX_PCT=95                # export share limit: no export starts that could push it above
                                 # this (planned with the full disk size), and running exports
                                 # are aborted if it is reached anyway

# ---- PVE side (import) ----------------------------------------------------------------
STORAGE="data"                   # target PVE storage
DISK_OPTS="discard=on"           # extra options for every imported disk (may be empty: "")
MAX_POOL_PCT=85                  # don't start an import that could push the storage above this
                                 # (planned with the full disk size)
POLL=30                          # seconds between checks for new files

# ---- status ----------------------------------------------------------------------------
RATE_WINDOW=1800                 # rate/ETA based on the last 30 min
STALL_SEC=300                    # no data written for 5 min -> STALL? (also used by list)
